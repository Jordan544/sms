<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EDUManage SMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">
            <div class="logo-icon"><i class="fa-solid fa-user-graduate"></i></div>
            EDUManage SMS
        </a>
        <ul class="navbar-nav">
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="register.html">Register Student</a></li>
            <li><a href="students.html">Student List</a></li>
        </ul>
        <div class="user-info">
            <div class="user-avatar">A</div>
            <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Dashboard</h1>
            <p>Welcome back, Administrator. Here's an overview of the school.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fa-solid fa-circle-user"></i></div>
                <div class="stat-info">
                    <h3 id="totalStudents">0</h3>
                    <p>Total Students</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-info">
                    <h3 id="activeStudents">0</h3>
                    <p>Active Students</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="fa-solid fa-book-journal-whills"></i></div>
                <div class="stat-info">
                    <h3 id="totalClasses">0</h3>
                    <p>Classes</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon red"><i class="fa-solid fa-file"></i></div>
                <div class="stat-info">
                    <h3 id="newThisMonth">0</h3>
                    <p>New This Month</p>
                </div>
            </div>
        </div>

        <div class="quick-actions">
            <h2>Quick Actions</h2>
            <div class="actions-grid">
                <a href="register.html" class="action-card">
                    <span class="action-icon"><i class="fa-solid fa-plus"></i></span>
                    <span>Register New Student</span>
                </a>
                <a href="students.html" class="action-card">
                    <span class="action-icon"><i class="fa-solid fa-list"></i></span>
                    <span>View Student List</span>
                </a>
            </div>
        </div>

        <div class="recent-section">
            <h2>Recent Activity</h2>
            <ul class="activity-list" id="activityList">
                <!-- Populated by JavaScript -->
            </ul>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/students.js"></script>
    <script src="js/main.js"></script>
    <script>
        if (!localStorage.getItem('currentUser')) {
            window.location.href = 'index.html';
        } else {
            loadDashboard();
        }
    </script>
</body>
</html>
