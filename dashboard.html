<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EduManage SMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script>try{var t=localStorage.getItem('sms_theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));}catch(e){}</script>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand"><i class="fa-solid fa-graduation-cap"></i> EduManage SMS</div>
            <nav id="nav"></nav>
        </aside>

        <div class="content">
            <header class="topbar">
                <h2 id="pageTitle">Dashboard</h2>
                <div class="user-box">
                    <button class="btn btn-secondary btn-sm" id="themeBtn" title="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
                    <div class="user-meta">
                        <strong id="userName"></strong><br>
                        <span class="role-badge" id="userRole"></span>
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </header>
            <main id="view"></main>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
