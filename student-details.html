<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details - School Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">
            <div class="logo-icon"><i class="fa-solid fa-user-graduate"></i></div>
            School MS
        </a>
        <ul class="navbar-nav">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="register.html">Register Student</a></li>
            <li><a href="students.html" class="active">Student List</a></li>
        </ul>
        <div class="user-info">
            <div class="user-avatar">A</div>
            <button class="btn btn-secondary btn-sm" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Student Details</h1>
            <p>View complete information about the student.</p>
        </div>

        <div id="detailsContainer">
            <!-- Populated by JavaScript -->
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/students.js"></script>
    <script>
        if (!localStorage.getItem('currentUser')) {
            window.location.href = 'index.html';
        } else {
            initStudentDetails();
        }
    </script>
</body>
</html>
